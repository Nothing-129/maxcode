<style>
  #maxcode-send-comparison {
    --preview-text: light-dark(#202124, #eeeeee);
    --preview-muted: light-dark(#737780, #a1a5ae);
    --preview-surface: light-dark(#ffffff, #24262b);
    --preview-border: light-dark(#e9e9ec, #383b43);
    --preview-shadow: light-dark(#00000008, #00000024);
    color: var(--preview-text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif;
    font-size: 14px;
    line-height: 1.5;
  }
  #maxcode-send-comparison * { box-sizing: border-box; }
  #maxcode-send-comparison .comparison-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 24px;
    padding: 28px 16px;
  }
  #maxcode-send-comparison .variant { min-width: 0; }
  #maxcode-send-comparison .variant-label {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 4px 12px;
    margin: 0 0 14px;
  }
  #maxcode-send-comparison .variant-name { font-weight: 500; }
  #maxcode-send-comparison .color-code {
    color: var(--preview-muted);
    font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
    font-size: 12px;
  }
  #maxcode-send-comparison .composer {
    padding: 16px 14px 12px;
    border: 1px solid var(--preview-border);
    border-radius: 20px;
    background: var(--preview-surface);
    box-shadow: 0 2px 8px var(--preview-shadow), 0 4px 24px var(--preview-shadow);
  }
  #maxcode-send-comparison .draft {
    min-height: 62px;
    padding: 0 2px;
    margin: 0;
  }
  #maxcode-send-comparison .composer-footer {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  #maxcode-send-comparison .attachment,
  #maxcode-send-comparison .agent {
    display: inline-flex;
    align-items: center;
    color: var(--preview-muted);
  }
  #maxcode-send-comparison .attachment {
    width: 24px;
    height: 32px;
    justify-content: center;
  }
  #maxcode-send-comparison .agent {
    gap: 4px;
    font-size: 12px;
  }
  #maxcode-send-comparison .attachment svg { width: 18px; height: 18px; }
  #maxcode-send-comparison .agent svg { width: 12px; height: 12px; }
  #maxcode-send-comparison .send-button {
    position: relative;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex: 0 0 32px;
    width: 32px;
    height: 32px;
    margin-left: auto;
    padding: 0;
    border: 0;
    border-radius: 50%;
    color: #ffffff;
    background: var(--send-color);
  }
  #maxcode-send-comparison .send-button svg {
    width: 16px;
    height: 16px;
    stroke-width: 2.5;
  }
  #maxcode-send-comparison .send-button:hover {
    background: color-mix(in srgb, var(--send-color) 90%, transparent);
  }
  #maxcode-send-comparison .preview-caption {
    margin: 12px 2px 0;
    color: var(--preview-muted);
    font-size: 12px;
  }
  @media (max-width: 560px) {
    #maxcode-send-comparison .comparison-grid {
      grid-template-columns: minmax(0, 1fr);
      gap: 28px;
      padding: 20px 12px;
    }
  }
  @media (pointer: coarse) {
    #maxcode-send-comparison .send-button::after {
      content: "";
      position: absolute;
      inset: -6px;
      border-radius: 50%;
    }
  }
</style>
<div id="maxcode-send-comparison" lang="zh-CN">
  <div class="comparison-grid viz-dotted-background">
    <section class="variant" aria-labelledby="send-bright-label" style="--send-color: #3CA1EF">
      <div class="variant-label" id="send-bright-label">
        <span class="variant-name">当前亮蓝色</span>
        <span class="color-code">#3CA1EF</span>
      </div>
      <div class="composer" aria-label="亮蓝色发送按钮预览">
        <p class="draft">帮我检查这段代码</p>
        <div class="composer-footer">
          <span class="attachment" aria-hidden="true"><i data-lucide="plus"></i></span>
          <span class="agent">Codex <i data-lucide="chevron-down" aria-hidden="true"></i></span>
          <button class="send-button cursor-interaction" type="button" aria-label="亮蓝色发送按钮，静态预览">
            <i data-lucide="arrow-up" aria-hidden="true"></i>
          </button>
        </div>
      </div>
      <p class="preview-caption">32 × 32 px · 白色上箭头</p>
    </section>
    <section class="variant" aria-labelledby="send-deep-label" style="--send-color: #216AE4">
      <div class="variant-label" id="send-deep-label">
        <span class="variant-name">图标蓝色层 · 深蓝</span>
        <span class="color-code">#216AE4</span>
      </div>
      <div class="composer" aria-label="深蓝色发送按钮预览">
        <p class="draft">帮我检查这段代码</p>
        <div class="composer-footer">
          <span class="attachment" aria-hidden="true"><i data-lucide="plus"></i></span>
          <span class="agent">Codex <i data-lucide="chevron-down" aria-hidden="true"></i></span>
          <button class="send-button cursor-interaction" type="button" aria-label="深蓝色发送按钮，静态预览">
            <i data-lucide="arrow-up" aria-hidden="true"></i>
          </button>
        </div>
      </div>
      <p class="preview-caption">32 × 32 px · 白色上箭头</p>
    </section>
  </div>
</div>
