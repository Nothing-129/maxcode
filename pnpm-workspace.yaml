packages:
  - electron

overrides:
  # Keep the stylesheet and every renderer on the same patched KaTeX.
  katex: ^0.19.0
  # ansi-to-react uses the compatible factory/tlds API from linkify-it 5.
  ansi-to-react>linkify-it: ^5.0.2

allowBuilds:
  "@parcel/watcher": true
  "@swc/core": true
  esbuild: true
  electron: true
  msw: true
  sharp: true
  unrs-resolver: true
  electron-winstaller: false
