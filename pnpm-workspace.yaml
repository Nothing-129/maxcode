packages:
  - electron

overrides:
  # Security fixes within the existing dependency major versions.
  dompurify: ^3.4.17
  body-parser: ^2.4.0
  fast-uri: ^3.1.9
  undici@6: ^6.29.1
  undici@7: ^7.30.1
  # Keep the stylesheet and every renderer on the same patched KaTeX.
  katex: ^0.19.0
  # ansi-to-react uses the compatible factory/tlds API from linkify-it 5.
  ansi-to-react>linkify-it: ^5.0.2

allowBuilds:
  "@parcel/watcher": true
  "@swc/core": true
  esbuild: true
  electron: true
  msw: true
  sharp: true
  unrs-resolver: true
  electron-winstaller: false
