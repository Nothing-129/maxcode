name: Test

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

env:
  RUST_BACKTRACE: short
  # Refuse to silently regenerate snapshots in CI — any drift must be
  # accepted locally with `cargo insta review` and committed.
  INSTA_UPDATE: "no"

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (lint + vitest + build)
    # Frontend tests are OS-independent (jsdom + pure TS), keep on Linux
    # to save CI minutes.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm eslint .

      - name: Unit tests (vitest)
        run: pnpm test

      - name: Static export build
        run: pnpm build

  rust:
    name: Rust ${{ matrix.mode }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15, windows-2022]
        mode: [electron, server]
        include:
          - mode: electron
            # Exercise native credentials and integration tests without the legacy shell.
            cargo_args: "--no-default-features --features native-keyring,test-utils --all-targets"
          - mode: server
            # File-store credential helper subprocess tests belong to this mode.
            cargo_args: "--no-default-features --features test-utils --all-targets"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          shared-key: test-${{ matrix.os }}-${{ matrix.mode }}
      - name: Install Linux native keyring dependencies
        if: runner.os == 'Linux' && matrix.mode == 'electron'
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev libssl-dev
      - name: cargo test
        working-directory: src-tauri
        run: cargo test ${{ matrix.cargo_args }}
      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy ${{ matrix.cargo_args }} -- -D warnings
      - name: Web handlers must route through commands/*_core
        if: runner.os == 'Linux' && matrix.mode == 'electron'
        working-directory: src-tauri
        run: |
          if grep -nE 'folder_service::|conversation_service::|tab_service::|import_service::' \
             src/web/handlers/folders.rs \
             src/web/handlers/conversations.rs; then
            echo "::error::Web handlers must call commands/*_core, not services directly."
            exit 1
          fi

  electron:
    name: Packaged Electron on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15, windows-2022]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          shared-key: electron-${{ matrix.os }}
      - name: Install Linux build and smoke dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev libssl-dev libgtk-3-0 libnss3 libasound2 libgbm1 xvfb
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build packaged desktop
        run: pnpm desktop:pack
      - name: Smoke test packaged desktop (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a pnpm desktop:smoke
      - name: Smoke test packaged desktop (macOS / Windows)
        if: runner.os != 'Linux'
        run: pnpm desktop:smoke
