name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
env:
  RUST_BACKTRACE: short
  HUSKY: 0
  # ------------------------------------------------------------------
  # 构建平台白名单：只构建这里列出的目标，改完提交后打 tag 生效。
  # DESKTOP_TARGETS（桌面安装包）可选值：
  #   x86_64-apple-darwin       macOS x64
  #   aarch64-apple-darwin      macOS arm64
  #   x86_64-unknown-linux-gnu  Linux x64
  #   x86_64-pc-windows-msvc    Windows x64
  #   aarch64-pc-windows-msvc   Windows arm64
  # SERVER_TARGETS（服务器包 + Docker 镜像，留空则两者都跳过）可选值：
  #   x86_64-unknown-linux-gnu / aarch64-unknown-linux-gnu
  #   x86_64-apple-darwin / aarch64-apple-darwin / x86_64-pc-windows-msvc
  # 注意：latest.json 只包含白名单内的桌面平台，未列出的平台
  # 收不到自动更新。
  # ------------------------------------------------------------------
  DESKTOP_TARGETS: "x86_64-apple-darwin,aarch64-apple-darwin,x86_64-pc-windows-msvc"
  SERVER_TARGETS: ""

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  create-draft-release:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.release.outputs.release_id }}
      release_url: ${{ steps.release.outputs.release_url }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      release_body: ${{ steps.release.outputs.release_body }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: meta
        name: Resolve release channel
        shell: bash
        run: |
          if [[ "${GITHUB_REF_NAME}" == *"-rc"* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check tag commit belongs to default branch
        shell: bash
        run: |
          DEFAULT_BRANCH="${{ github.event.repository.default_branch }}"
          git fetch origin "${DEFAULT_BRANCH}"

          TAG_COMMIT=$(git rev-list -n 1 "${GITHUB_REF_NAME}")
          if git merge-base --is-ancestor "${TAG_COMMIT}" "origin/${DEFAULT_BRANCH}"; then
            echo "Tag ${GITHUB_REF_NAME} is based on ${DEFAULT_BRANCH}"
          else
            echo "Tag ${GITHUB_REF_NAME} is not based on ${DEFAULT_BRANCH}"
            exit 1
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"

      - name: Verify tag matches app version
        shell: bash
        run: |
          APP_VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [[ "v$APP_VERSION" != "${GITHUB_REF_NAME}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match app version v$APP_VERSION"
            exit 1
          fi

      - name: Require updater signing key
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        shell: bash
        run: |
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            echo "FATAL: TAURI_SIGNING_PRIVATE_KEY is required so this release can serve auto-updates"
            exit 1
          fi

      - name: Verify updater signing key unlocks
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          echo probe > /tmp/updater-sign-probe
          pnpm tauri signer sign /tmp/updater-sign-probe
          test -f /tmp/updater-sign-probe.sig

      - name: Require Apple release credentials
        if: contains(env.DESKTOP_TARGETS, 'apple-darwin')
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          for name in \
            APPLE_ID \
            APPLE_PASSWORD \
            APPLE_CERTIFICATE \
            APPLE_CERTIFICATE_PASSWORD \
            KEYCHAIN_PASSWORD
          do
            if [ -z "${!name:-}" ]; then
              echo "FATAL: GitHub secret $name is required for signed and notarized macOS releases"
              exit 1
            fi
          done

      - id: release
        name: Create or reuse draft release
        uses: actions/github-script@v7
        env:
          PRERELEASE: ${{ steps.meta.outputs.prerelease }}
        with:
          script: |
            const tag = context.ref.replace("refs/tags/", "");
            const { owner, repo } = context.repo;
            const prerelease = process.env.PRERELEASE === "true";
            const releaseName = `MaxCode ${tag}`;
            const { data: tagRef } = await github.rest.git.getRef({
              owner,
              repo,
              ref: `tags/${tag}`,
            });

            let commitSha = tagRef.object.sha;
            if (tagRef.object.type === "tag") {
              const { data: annotatedTag } = await github.rest.git.getTag({
                owner,
                repo,
                tag_sha: commitSha,
              });
              if (annotatedTag.object.type !== "commit") {
                core.setFailed(
                  `Tag ${tag} points to ${annotatedTag.object.type}, not a commit.`,
                );
                return;
              }
              commitSha = annotatedTag.object.sha;
            }

            const { data: commit } = await github.rest.repos.getCommit({
              owner,
              repo,
              ref: commitSha,
            });

            const releaseBody =
              commit.commit.message?.trim() || "_No commit message._";
            let release;

            try {
              const existing = await github.rest.repos.getReleaseByTag({
                owner,
                repo,
                tag,
              });

              if (!existing.data.draft) {
                core.setFailed(
                  `Release for tag ${tag} already exists and is not a draft.`,
                );
                return;
              }

              release = existing.data;
              if (
                release.prerelease !== prerelease ||
                release.name !== releaseName ||
                (release.body ?? "").trim() !== releaseBody
              ) {
                const updated = await github.rest.repos.updateRelease({
                  owner,
                  repo,
                  release_id: release.id,
                  name: releaseName,
                  prerelease,
                  body: releaseBody,
                });
                release = updated.data;
              }
              core.info(`Reusing existing draft release #${release.id}`);
            } catch (error) {
              if (error.status !== 404) {
                throw error;
              }

              const created = await github.rest.repos.createRelease({
                owner,
                repo,
                tag_name: tag,
                name: releaseName,
                body: releaseBody,
                draft: true,
                prerelease,
              });

              release = created.data;
              core.info(`Created draft release #${release.id}`);
            }

            core.setOutput("release_id", String(release.id));
            core.setOutput("release_url", release.html_url);
            core.setOutput("release_body", releaseBody);

  resolve-matrix:
    name: Resolve build matrix
    runs-on: ubuntu-22.04
    outputs:
      tauri_matrix: ${{ steps.resolve.outputs.tauri_matrix }}
      server_matrix: ${{ steps.resolve.outputs.server_matrix }}
      # 白名单内桌面平台对应的 Tauri 更新器 platform key，供
      # publish-release 校验 latest.json 完整性。
      updater_required: ${{ steps.resolve.outputs.updater_required }}
    steps:
      - id: resolve
        name: Expand platform whitelist into build matrices
        shell: bash
        run: |
          set -euo pipefail

          # 每个目标一行：显示名 | runner | 服务器产物名 | 更新器平台 key
          # （更新器 key 与 Rust std::env::consts 的 os-arch 命名一致）。
          # Linux arm64 桌面版刻意不提供：jammy 多架构交叉依赖安装仍会卡在
          # libpng16-16:arm64 版本冲突（"held broken packages"）；
          # Linux arm64 用户由服务器包和 Docker 镜像覆盖。
          meta_for() {
            case "$1" in
              x86_64-apple-darwin) echo "macOS x64|macos-latest|MaxCode-server-darwin-x64|darwin-x86_64" ;;
              aarch64-apple-darwin) echo "macOS arm64|macos-latest|MaxCode-server-darwin-arm64|darwin-aarch64" ;;
              x86_64-unknown-linux-gnu) echo "Linux x64|ubuntu-22.04|MaxCode-server-linux-x64|linux-x86_64" ;;
              aarch64-unknown-linux-gnu) echo "Linux arm64|ubuntu-22.04|MaxCode-server-linux-arm64|linux-arm64" ;;
              x86_64-pc-windows-msvc) echo "Windows x64|windows-2022|MaxCode-server-windows-x64|windows-x86_64" ;;
              aarch64-pc-windows-msvc) echo "Windows arm64|windows-latest||windows-aarch64" ;;
              *)
                echo "FATAL: 未知的目标 triple: $1（可选值见 workflow 顶部白名单注释）" >&2
                exit 1
                ;;
            esac
          }

          split_targets() {
            tr ',' '\n' <<<"${1:-}" \
              | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' \
              | awk 'NF && !seen[$0]++'
          }

          # strategy.matrix requires an object. Use an include-only matrix so
          # each resolved target can carry its own runner and metadata.
          tauri_matrix='{"include":[]}'
          updater_required=""
          while IFS= read -r target; do
            if [ "$target" = "aarch64-unknown-linux-gnu" ]; then
              echo "FATAL: Linux arm64 暂不支持桌面构建（见 meta_for 注释）" >&2
              exit 1
            fi
            meta="$(meta_for "$target")"
            IFS='|' read -r name runner _artifact updater_key <<<"$meta"
            tauri_matrix="$(jq -c --arg n "$name" --arg r "$runner" --arg t "$target" \
              '.include += [{name: $n, runner: $r, target: $t}]' <<<"$tauri_matrix")"
            updater_required="$updater_required $updater_key"
          done < <(split_targets "$DESKTOP_TARGETS")

          server_matrix='{"include":[]}'
          while IFS= read -r target; do
            meta="$(meta_for "$target")"
            IFS='|' read -r name runner artifact _updater_key <<<"$meta"
            if [ -z "$artifact" ]; then
              echo "FATAL: $target 没有对应的服务器产物" >&2
              exit 1
            fi
            server_matrix="$(jq -c --arg n "$name" --arg r "$runner" --arg t "$target" --arg a "$artifact" \
              '.include += [{name: $n, runner: $r, target: $t, artifact: $a}]' <<<"$server_matrix")"
          done < <(split_targets "$SERVER_TARGETS")

          {
            echo "tauri_matrix=$tauri_matrix"
            echo "server_matrix=$server_matrix"
            echo "updater_required=${updater_required# }"
          } >> "$GITHUB_OUTPUT"
          echo "tauri_matrix=$tauri_matrix"
          echo "server_matrix=$server_matrix"
          echo "updater_required=${updater_required# }"

  build-tauri:
    needs:
      - create-draft-release
      - resolve-matrix
    # Job-level conditions are evaluated before matrix expansion, so an empty
    # whitelist skips cleanly instead of producing an invalid empty matrix.
    if: ${{ needs.resolve-matrix.outputs.tauri_matrix != '{"include":[]}' }}
    name: Build ${{ matrix.name }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      # 矩阵由 resolve-matrix 按 workflow 顶部 DESKTOP_TARGETS 白名单展开；
      # 空列表时整个任务被跳过，publish-release 的 if 会随之拦下发布。
      matrix: ${{ fromJSON(needs.resolve-matrix.outputs.tauri_matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          shared-key: ${{ matrix.target }}

      - name: Install Linux x64 dependencies
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          # Bound apt so a stuck mirror cannot pin the matrix (and the
          # publish job) for the runner's 6-hour timeout. 0.25.4 hung here
          # for the full six hours and never published the finished macOS /
          # Windows artifacts.
          sudo timeout 180 apt-get update
          sudo timeout 180 apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # Build the `codeg-mcp` companion binary for the matrix target and
      # stage it as a Tauri sidecar at
      # `src-tauri/binaries/codeg-mcp-<triple>{.exe}`. `tauri-action` (below)
      # then bundles it via the `bundle.externalBin` entry in
      # `tauri.conf.json` — Tauri installs it next to the main executable
      # (Contents/MacOS on macOS, install root on Linux/Windows) where the
      # runtime `locate_codeg_mcp_binary()` finds it via `current_exe`
      # sibling lookup. The Linux arm64 cross env vars set above also
      # apply to this cargo invocation.
      - name: Stage codeg-mcp sidecar for Tauri bundle
        shell: bash
        run: pnpm tauri:prepare-sidecars --target ${{ matrix.target }}

      - name: Verify codeg-mcp sidecar landed
        shell: bash
        run: |
          ext=""
          case "${{ matrix.target }}" in
            *windows*) ext=".exe" ;;
          esac
          file="src-tauri/binaries/codeg-mcp-${{ matrix.target }}${ext}"
          if [ ! -f "$file" ]; then
            echo "FATAL: sidecar $file missing after prepare-sidecars"
            exit 1
          fi
          ls -la "$file"

      - name: Prepare desktop bundle config
        shell: bash
        run: |
          cat > src-tauri/ci-release.conf.json <<'EOF'
          {
            "bundle": {
              "createUpdaterArtifacts": true
            }
          }
          EOF

      - name: Import Apple Developer certificate
        if: contains(matrix.target, 'apple-darwin')
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          certificate_path="$RUNNER_TEMP/developer-id-application.p12"
          keychain_path="$RUNNER_TEMP/maxcode-signing.keychain-db"

          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$certificate_path"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security default-keychain -s "$keychain_path"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security set-keychain-settings -t 3600 -u "$keychain_path"
          security import "$certificate_path" \
            -k "$keychain_path" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$keychain_path"
          rm -f "$certificate_path"

          identity="$(security find-identity -v -p codesigning "$keychain_path" \
            | sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' \
            | head -n 1)"
          expected='Developer ID Application: Dalv Cloud (Beijing) Technology Co., Ltd (ZGF375V7M7)'
          if [ "$identity" != "$expected" ]; then
            echo "FATAL: expected Developer ID identity was not imported"
            exit 1
          fi
          echo "APPLE_SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"

      - name: Build and upload to draft release (Windows)
        if: contains(matrix.target, 'windows')
        uses: tauri-apps/tauri-action@v0.6.1
        env:
          # The matrix-target sidecar is already staged and verified above.
          # Skip the duplicate beforeBuildCommand sidecar pass so cross builds
          # do not fall back to the runner host triple.
          CODEG_SKIP_SIDECAR: "1"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.create-draft-release.outputs.release_id }}
          tagName: ${{ github.ref_name }}
          releaseBody: ${{ needs.create-draft-release.outputs.release_body }}
          releaseDraft: true
          prerelease: ${{ needs.create-draft-release.outputs.prerelease }}
          tauriScript: pnpm tauri
          # Skip MSI bundling on Windows: tauri-apps/tauri#14681 — light.exe
          # fails when externalBin is configured. Do NOT pass --no-sign:
          # tauri-cli treats it as skipping updater minisign too, which
          # drops windows-* from latest.json.
          args: >-
            --target ${{ matrix.target }}
            --bundles nsis
            --config src-tauri/ci-release.conf.json
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          retryAttempts: 2

      - name: Build and upload to draft release (Linux x64)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        uses: tauri-apps/tauri-action@v0.6.1
        env:
          # The matrix-target sidecar is already staged and verified above.
          # Skip the duplicate beforeBuildCommand sidecar pass so cross builds
          # do not fall back to the runner host triple.
          CODEG_SKIP_SIDECAR: "1"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.create-draft-release.outputs.release_id }}
          tagName: ${{ github.ref_name }}
          releaseBody: ${{ needs.create-draft-release.outputs.release_body }}
          releaseDraft: true
          prerelease: ${{ needs.create-draft-release.outputs.prerelease }}
          tauriScript: pnpm tauri
          args: >-
            --target ${{ matrix.target }}
            --config src-tauri/ci-release.conf.json
          includeUpdaterJson: true
          retryAttempts: 2

      - name: Build, sign, notarize and upload app to draft release (macOS)
        if: contains(matrix.target, 'apple-darwin')
        uses: tauri-apps/tauri-action@v0.6.1
        env:
          # The matrix-target sidecar is already staged and verified above.
          # Skip the duplicate beforeBuildCommand sidecar pass so cross builds
          # do not fall back to the runner host triple.
          CODEG_SKIP_SIDECAR: "1"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ZGF375V7M7
        with:
          releaseId: ${{ needs.create-draft-release.outputs.release_id }}
          tagName: ${{ github.ref_name }}
          releaseBody: ${{ needs.create-draft-release.outputs.release_body }}
          releaseDraft: true
          prerelease: ${{ needs.create-draft-release.outputs.prerelease }}
          tauriScript: pnpm tauri
          args: >-
            --target ${{ matrix.target }}
            --config src-tauri/ci-release.conf.json
          includeUpdaterJson: true
          retryAttempts: 2

      - name: Verify updater signatures were produced
        shell: bash
        run: |
          set -euo pipefail
          bundle="src-tauri/target/${{ matrix.target }}/release/bundle"
          echo "bundle contents:"
          find "$bundle" -type f | sort
          sigs=$(find "$bundle" -name '*.sig' -type f)
          if [ -z "$sigs" ]; then
            echo "FATAL: no updater .sig under $bundle"
            exit 1
          fi
          echo "signed:"
          echo "$sigs"

      - name: Verify macOS app signature
        if: contains(matrix.target, 'apple-darwin')
        shell: bash
        run: |
          set -euo pipefail
          app="src-tauri/target/${{ matrix.target }}/release/bundle/macos/MaxCode.app"
          test -d "$app"
          test -f "$app/Contents/_CodeSignature/CodeResources"
          codesign --verify --deep --strict --verbose=2 "$app"

  build-server:
    needs:
      - create-draft-release
      - resolve-matrix
    if: ${{ needs.resolve-matrix.outputs.server_matrix != '{"include":[]}' }}
    name: Server ${{ matrix.name }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      # 矩阵由 resolve-matrix 按 workflow 顶部 SERVER_TARGETS 白名单展开；
      # 空列表时整个任务被跳过，build-docker 也随之自动跳过。
      matrix: ${{ fromJSON(needs.resolve-matrix.outputs.server_matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          shared-key: server-${{ matrix.target }}

      - name: Install Linux arm64 cross compiler
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          cat > /tmp/sources.list << 'EOF'
          deb [arch=amd64] http://archive.ubuntu.com/ubuntu jammy main restricted universe multiverse
          deb [arch=amd64] http://archive.ubuntu.com/ubuntu jammy-updates main restricted universe multiverse
          deb [arch=amd64] http://archive.ubuntu.com/ubuntu jammy-backports main restricted universe multiverse
          deb [arch=amd64] http://security.ubuntu.com/ubuntu jammy-security main restricted universe multiverse

          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy main restricted universe multiverse
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy-updates main restricted universe multiverse
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy-backports main restricted universe multiverse
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy-security main restricted universe multiverse
          EOF
          sudo mv /etc/apt/sources.list /etc/apt/sources.list.default
          sudo mv /tmp/sources.list /etc/apt/sources.list

          sudo dpkg --add-architecture arm64
          sudo apt-get update
          # libssl3 is Multi-Arch: same; align the preinstalled :amd64 copy
          # with the version libssl-dev:arm64 pins so the cross install isn't
          # blocked by a held-back amd64 copy (same failure mode as the desktop
          # arm64 build — see the build-tauri step for the full rationale).
          sudo apt-get install -y --only-upgrade libssl3
          sudo apt-get install -y \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            libssl-dev:arm64
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_ALLOW_CROSS=1" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=/usr/lib/aarch64-linux-gnu/pkgconfig:/usr/share/pkgconfig" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_LIBDIR=/usr/lib/aarch64-linux-gnu/pkgconfig:/usr/share/pkgconfig" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_SYSROOT_DIR=/usr/aarch64-linux-gnu" >> "$GITHUB_ENV"
          echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
          echo "CXX_aarch64_unknown_linux_gnu=aarch64-linux-gnu-g++" >> "$GITHUB_ENV"
          echo "AR_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc-ar" >> "$GITHUB_ENV"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"

      - name: Build frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Build server + codeg-mcp companion
        working-directory: src-tauri
        # `codeg-mcp` is the stdio MCP companion the runtime injects per
        # session (see acp/delegation/companion.rs). Built with the same
        # `--no-default-features --target` flags as the server so it shares
        # the cross-compile env (Linux arm64) without dragging in tauri
        # runtime deps.
        run: |
          cargo build --release --bin codeg-server --no-default-features --target ${{ matrix.target }}
          cargo build --release --bin codeg-mcp --no-default-features --target ${{ matrix.target }}

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist/${{ matrix.artifact }}
          cp src-tauri/target/${{ matrix.target }}/release/codeg-server dist/${{ matrix.artifact }}/
          cp src-tauri/target/${{ matrix.target }}/release/codeg-mcp dist/${{ matrix.artifact }}/
          chmod +x dist/${{ matrix.artifact }}/codeg-server dist/${{ matrix.artifact }}/codeg-mcp
          cp -r out dist/${{ matrix.artifact }}/web
          cd dist && tar czf ${{ matrix.artifact }}.tar.gz ${{ matrix.artifact }}

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/${{ matrix.artifact }}
          Copy-Item src-tauri/target/${{ matrix.target }}/release/codeg-server.exe dist/${{ matrix.artifact }}/
          Copy-Item src-tauri/target/${{ matrix.target }}/release/codeg-mcp.exe dist/${{ matrix.artifact }}/
          Copy-Item -Recurse out dist/${{ matrix.artifact }}/web
          Compress-Archive -Path dist/${{ matrix.artifact }} -DestinationPath dist/${{ matrix.artifact }}.zip

      - name: Smoke test packaged artifact (Unix)
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          test -x "dist/${{ matrix.artifact }}/codeg-server"
          test -x "dist/${{ matrix.artifact }}/codeg-mcp"
          # `codeg-mcp --help` exits 0 without flags and prints the usage
          # line. Only run it for native targets; cross-compiled arm64
          # binaries on x64 runners can't execute.
          if [ "${{ matrix.target }}" = "x86_64-unknown-linux-gnu" ] || \
             [ "${{ matrix.target }}" = "x86_64-apple-darwin" ] || \
             [ "${{ matrix.target }}" = "aarch64-apple-darwin" ]; then
            "dist/${{ matrix.artifact }}/codeg-mcp" --help | grep -F 'codeg-mcp --parent-connection-id'
          else
            echo "skipping codeg-mcp --help on cross-target ${{ matrix.target }}"
          fi

      - name: Smoke test packaged artifact (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/${{ matrix.artifact }}/codeg-server.exe")) {
            throw "codeg-server.exe missing from packaged artifact"
          }
          if (-not (Test-Path "dist/${{ matrix.artifact }}/codeg-mcp.exe")) {
            throw "codeg-mcp.exe missing from packaged artifact"
          }
          $help = & "dist/${{ matrix.artifact }}/codeg-mcp.exe" --help
          if ($help -notlike "*codeg-mcp --parent-connection-id*") {
            throw "codeg-mcp --help output unexpected: $help"
          }

      - name: Upload artifact for Docker build (Linux only)
        if: startsWith(matrix.target, 'x86_64-unknown-linux') || startsWith(matrix.target, 'aarch64-unknown-linux')
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}
          retention-days: 1

      # Sign the server bundle with the SAME minisign key the desktop
      # updater uses (`tauri signer sign` writes `<file>.sig`). The server's
      # `update::verify` module verifies this signature against the embedded
      # public key before installing — see src-tauri/src/update/verify.rs.
      # Missing key is a hard error: every release must ship signed artifacts
      # so in-app auto-update can verify them.
      - name: Sign and checksum bundle (Unix)
        if: runner.os != 'Windows'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            echo "FATAL: TAURI_SIGNING_PRIVATE_KEY is required to sign ${{ matrix.artifact }}"
            exit 1
          fi
          pnpm tauri signer sign "dist/${{ matrix.artifact }}.tar.gz"
          test -f "dist/${{ matrix.artifact }}.tar.gz.sig"
          ( cd dist && shasum -a 256 "${{ matrix.artifact }}.tar.gz" > "${{ matrix.artifact }}.tar.gz.sha256" )

      - name: Sign and checksum bundle (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) {
            throw "TAURI_SIGNING_PRIVATE_KEY is required to sign ${{ matrix.artifact }}"
          }
          pnpm tauri signer sign "dist/${{ matrix.artifact }}.zip"
          if (-not (Test-Path "dist/${{ matrix.artifact }}.zip.sig")) {
            throw "signature not produced for ${{ matrix.artifact }}.zip"
          }
          $hash = (Get-FileHash -Algorithm SHA256 "dist/${{ matrix.artifact }}.zip").Hash.ToLower()
          "$hash  ${{ matrix.artifact }}.zip" | Out-File -Encoding ascii "dist/${{ matrix.artifact }}.zip.sha256"

      - name: Upload to release (Unix)
        if: runner.os != 'Windows'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          files=( "dist/${{ matrix.artifact }}.tar.gz" "dist/${{ matrix.artifact }}.tar.gz.sha256" )
          if [ -f "dist/${{ matrix.artifact }}.tar.gz.sig" ]; then
            files+=( "dist/${{ matrix.artifact }}.tar.gz.sig" )
          fi
          gh release upload "${{ github.ref_name }}" "${files[@]}" --clobber

      - name: Upload to release (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $files = @("dist/${{ matrix.artifact }}.zip", "dist/${{ matrix.artifact }}.zip.sha256")
          if (Test-Path "dist/${{ matrix.artifact }}.zip.sig") {
            $files += "dist/${{ matrix.artifact }}.zip.sig"
          }
          gh release upload "${{ github.ref_name }}" $files --clobber

  build-docker:
    # SERVER_TARGETS 为空时 build-server 被跳过，本任务也随之自动跳过。
    needs:
      - create-draft-release
      - build-server
    name: Build Docker image
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Download Linux x64 artifact
        uses: actions/download-artifact@v4
        with:
          name: MaxCode-server-linux-x64
          path: artifacts/linux-x64

      - name: Download Linux arm64 artifact
        uses: actions/download-artifact@v4
        with:
          name: MaxCode-server-linux-arm64
          path: artifacts/linux-arm64

      - name: Prepare Docker build context
        run: |
          set -euo pipefail
          mkdir -p dist/amd64 dist/arm64
          cp artifacts/linux-x64/codeg-server dist/amd64/codeg-server
          cp artifacts/linux-x64/codeg-mcp dist/amd64/codeg-mcp
          cp artifacts/linux-arm64/codeg-server dist/arm64/codeg-server
          cp artifacts/linux-arm64/codeg-mcp dist/arm64/codeg-mcp
          cp -r artifacts/linux-x64/web dist/web
          chmod +x dist/amd64/codeg-server dist/amd64/codeg-mcp \
                   dist/arm64/codeg-server dist/arm64/codeg-mcp
          # Fail fast if any companion went missing — Docker would otherwise
          # produce an image where delegation silently degrades.
          for f in dist/amd64/codeg-mcp dist/arm64/codeg-mcp; do
            test -x "$f" || { echo "FATAL: $f missing or non-exec"; exit 1; }
          done

      - name: Set up QEMU (for multi-arch manifest)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image tags
        id: version
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          image_repository="${GITHUB_REPOSITORY,,}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          tags=$'ghcr.io/'"$image_repository"':'"$version"$'\n''ghcr.io/'"$image_repository"':latest'
          if [ -n "${DOCKERHUB_USERNAME}" ]; then
            echo "dockerhub=true" >> "$GITHUB_OUTPUT"
            tags+=$'\n'"${DOCKERHUB_USERNAME}/codeg:${version}"$'\n'"${DOCKERHUB_USERNAME}/codeg:latest"
          else
            echo "dockerhub=false" >> "$GITHUB_OUTPUT"
          fi
          {
            echo "tags<<EOF"
            printf '%s\n' "$tags"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        if: steps.version.outputs.dockerhub == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.ci
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.version.outputs.tags }}

  publish-release:
    needs:
      - create-draft-release
      - resolve-matrix
      - build-tauri
    # Publish even if one matrix cell fails or times out (Linux apt flake
    # on 0.25.4 cancelled the whole job after 6h and left a finished draft
    # unpublished). A job timeout is `cancelled`, not `failure`.
    if: ${{ always() && needs.create-draft-release.result == 'success' && needs.build-tauri.result != 'skipped' }}
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Require updater manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          UPDATER_REQUIRED: ${{ needs.resolve-matrix.outputs.updater_required }}
        run: |
          set -euo pipefail
          # This job has no checkout; GH_REPO keeps `gh` from looking for .git.
          assets=$(gh release view "${{ github.ref_name }}" --json assets --jq '.assets[].name')
          printf '%s\n' "$assets"
          echo "$assets" | grep -qx 'latest.json' || {
            echo "FATAL: latest.json missing from the draft release"
            exit 1
          }
          echo "$assets" | grep -q '\.sig$' || {
            echo "FATAL: no updater .sig artifacts on the draft release"
            exit 1
          }
          gh release download "${{ github.ref_name }}" --pattern latest.json --dir /tmp
          python3 - <<'PY'
          import json, os, sys
          platforms = json.load(open("/tmp/latest.json")).get("platforms") or {}
          print("platforms:", ", ".join(sorted(platforms)))
          # 只要求白名单内实际构建的桌面平台（resolve-matrix 计算）
          required = os.environ["UPDATER_REQUIRED"].split()
          missing = [p for p in required if p not in platforms]
          if missing:
              print("FATAL: latest.json missing", ", ".join(missing), file=sys.stderr)
              sys.exit(1)
          PY

      - name: Publish draft release
        uses: actions/github-script@v7
        env:
          RELEASE_ID: ${{ needs.create-draft-release.outputs.release_id }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const releaseId = Number(process.env.RELEASE_ID);
            const prerelease =
              "${{ needs.create-draft-release.outputs.prerelease }}" === "true";

            await github.rest.repos.updateRelease({
              owner,
              repo,
              release_id: releaseId,
              draft: false,
              prerelease,
            });

            core.info(`Published release #${releaseId}`);
