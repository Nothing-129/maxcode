name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
env:
  RUST_BACKTRACE: short
  HUSKY: 0
  # ------------------------------------------------------------------
  # 构建平台白名单：只构建这里列出的目标，改完提交后打 tag 生效。
  # DESKTOP_TARGETS（桌面安装包）可选值：
  #   x86_64-apple-darwin       macOS x64
  #   aarch64-apple-darwin      macOS arm64
  #   x86_64-unknown-linux-gnu  Linux x64
  #   x86_64-pc-windows-msvc    Windows x64
  #   aarch64-pc-windows-msvc   Windows arm64
  # SERVER_TARGETS（服务器包 + Docker 镜像，留空则两者都跳过）可选值：
  #   x86_64-unknown-linux-gnu / aarch64-unknown-linux-gnu
  #   x86_64-apple-darwin / aarch64-apple-darwin / x86_64-pc-windows-msvc
  # Electron 更新清单按平台与架构分开，发布 blockmap 以支持差分下载。
  # 桌面使用目标架构原生 runner；Linux arm64 仅支持服务器包。
  # ------------------------------------------------------------------
  DESKTOP_TARGETS: "x86_64-apple-darwin,aarch64-apple-darwin,x86_64-pc-windows-msvc"
  SERVER_TARGETS: ""

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  create-draft-release:
    # Downstream releases may only write to the user's own repository.
    if: github.repository == 'Nothing-129/maxcode'
    needs: resolve-matrix
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.release.outputs.release_id }}
      release_url: ${{ steps.release.outputs.release_url }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      release_body: ${{ steps.release.outputs.release_body }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: meta
        name: Resolve release channel
        shell: bash
        run: |
          if [[ "${GITHUB_REF_NAME}" == *"-rc"* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check tag commit belongs to default branch
        shell: bash
        run: |
          DEFAULT_BRANCH="${{ github.event.repository.default_branch }}"
          git fetch origin "${DEFAULT_BRANCH}"

          TAG_COMMIT=$(git rev-list -n 1 "${GITHUB_REF_NAME}")
          if git merge-base --is-ancestor "${TAG_COMMIT}" "origin/${DEFAULT_BRANCH}"; then
            echo "Tag ${GITHUB_REF_NAME} is based on ${DEFAULT_BRANCH}"
          else
            echo "Tag ${GITHUB_REF_NAME} is not based on ${DEFAULT_BRANCH}"
            exit 1
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"

      - name: Verify tag matches app version
        shell: bash
        run: |
          APP_VERSION=$(node -p "require('./package.json').version")
          if [[ "v$APP_VERSION" != "${GITHUB_REF_NAME}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match app version v$APP_VERSION"
            exit 1
          fi

      - name: Require server updater signing key
        if: env.SERVER_TARGETS != ''
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        shell: bash
        run: |
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            echo "FATAL: TAURI_SIGNING_PRIVATE_KEY is required to sign server update bundles"
            exit 1
          fi

      - name: Verify server updater signing key unlocks
        if: env.SERVER_TARGETS != ''
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          echo probe > /tmp/updater-sign-probe
          pnpm tauri signer sign /tmp/updater-sign-probe
          test -f /tmp/updater-sign-probe.sig

      - name: Require Apple release credentials
        if: contains(env.DESKTOP_TARGETS, 'apple-darwin')
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          set -euo pipefail
          for name in \
            APPLE_ID \
            APPLE_PASSWORD \
            APPLE_CERTIFICATE \
            APPLE_CERTIFICATE_PASSWORD \
            APPLE_TEAM_ID
          do
            if [ -z "${!name:-}" ]; then
              echo "FATAL: GitHub secret $name is required for signed and notarized macOS releases"
              exit 1
            fi
          done

      - id: release
        name: Create or reuse draft release
        uses: actions/github-script@v7
        env:
          PRERELEASE: ${{ steps.meta.outputs.prerelease }}
        with:
          script: |
            const tag = context.ref.replace("refs/tags/", "");
            const { owner, repo } = context.repo;
            const prerelease = process.env.PRERELEASE === "true";
            const releaseName = `MaxCode ${tag}`;
            const { data: tagRef } = await github.rest.git.getRef({
              owner,
              repo,
              ref: `tags/${tag}`,
            });

            let commitSha = tagRef.object.sha;
            if (tagRef.object.type === "tag") {
              const { data: annotatedTag } = await github.rest.git.getTag({
                owner,
                repo,
                tag_sha: commitSha,
              });
              if (annotatedTag.object.type !== "commit") {
                core.setFailed(
                  `Tag ${tag} points to ${annotatedTag.object.type}, not a commit.`,
                );
                return;
              }
              commitSha = annotatedTag.object.sha;
            }

            const { data: commit } = await github.rest.repos.getCommit({
              owner,
              repo,
              ref: commitSha,
            });

            const releaseBody =
              commit.commit.message?.trim() || "_No commit message._";
            let release;

            try {
              const existing = await github.rest.repos.getReleaseByTag({
                owner,
                repo,
                tag,
              });

              if (!existing.data.draft) {
                core.setFailed(
                  `Release for tag ${tag} already exists and is not a draft.`,
                );
                return;
              }

              release = existing.data;
              if (
                release.prerelease !== prerelease ||
                release.name !== releaseName ||
                (release.body ?? "").trim() !== releaseBody
              ) {
                const updated = await github.rest.repos.updateRelease({
                  owner,
                  repo,
                  release_id: release.id,
                  name: releaseName,
                  prerelease,
                  body: releaseBody,
                });
                release = updated.data;
              }
              core.info(`Reusing existing draft release #${release.id}`);
            } catch (error) {
              if (error.status !== 404) {
                throw error;
              }

              const created = await github.rest.repos.createRelease({
                owner,
                repo,
                tag_name: tag,
                name: releaseName,
                body: releaseBody,
                draft: true,
                prerelease,
              });

              release = created.data;
              core.info(`Created draft release #${release.id}`);
            }

            core.setOutput("release_id", String(release.id));
            core.setOutput("release_url", release.html_url);
            core.setOutput("release_body", releaseBody);

  resolve-matrix:
    name: Resolve build matrix
    runs-on: ubuntu-22.04
    outputs:
      desktop_matrix: ${{ steps.resolve.outputs.desktop_matrix }}
      server_matrix: ${{ steps.resolve.outputs.server_matrix }}
      docker: ${{ steps.resolve.outputs.docker }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - id: resolve
        name: Expand platform whitelist into native desktop and server matrices
        run: node electron/scripts/release.cjs matrix

  build-electron:
    needs:
      - create-draft-release
      - resolve-matrix
    if: ${{ needs.resolve-matrix.outputs.desktop_matrix != '{"include":[]}' }}
    name: Electron ${{ matrix.name }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve-matrix.outputs.desktop_matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify native backend and Electron architecture
        run: node electron/scripts/release.cjs verify-host ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          shared-key: electron-${{ matrix.target }}
      - name: Install Linux build and smoke dependencies
        if: runner.os == 'Linux'
        run: |
          sudo timeout 180 apt-get update
          sudo timeout 180 apt-get install -y libdbus-1-dev libssl-dev libgtk-3-0 libnss3 libasound2 libgbm1 xvfb rpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build Electron installers (macOS, signed and notarized)
        if: runner.os == 'macOS'
        env:
          CSC_LINK: ${{ secrets.APPLE_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CODEG_ELECTRON_RELEASE: "1"
        run: pnpm desktop:build
      - name: Build Electron installers (Windows / Linux)
        if: runner.os != 'macOS'
        run: pnpm desktop:build
      - name: Verify signed and notarized macOS application
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          apps=(electron/dist/mac*/maxcode.app)
          test "${#apps[@]}" -eq 1
          codesign --verify --deep --strict --verbose=2 "${apps[0]}"
          xcrun stapler validate "${apps[0]}"
          spctl --assess --type execute --verbose=2 "${apps[0]}"
      - name: Smoke test packaged application (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a pnpm desktop:smoke
      - name: Smoke test packaged application (macOS / Windows)
        if: runner.os != 'Linux'
        run: pnpm desktop:smoke
      - name: Verify installers and write checksums
        run: node electron/scripts/release.cjs checksum ${{ matrix.target }}
      - name: Upload installers to the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "$GITHUB_REF_NAME" electron/dist/MaxCode-Electron-* electron/dist/latest-*.yml --clobber

  build-server:
    needs:
      - create-draft-release
      - resolve-matrix
    if: ${{ needs.resolve-matrix.outputs.server_matrix != '{"include":[]}' }}
    name: Server ${{ matrix.name }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      # 矩阵由 resolve-matrix 按 workflow 顶部 SERVER_TARGETS 白名单展开；
      # 空列表时整个任务被跳过，build-docker 也随之自动跳过。
      matrix: ${{ fromJSON(needs.resolve-matrix.outputs.server_matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          shared-key: server-${{ matrix.target }}

      - name: Install Linux arm64 cross compiler
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          cat > /tmp/sources.list << 'EOF'
          deb [arch=amd64] http://archive.ubuntu.com/ubuntu jammy main restricted universe multiverse
          deb [arch=amd64] http://archive.ubuntu.com/ubuntu jammy-updates main restricted universe multiverse
          deb [arch=amd64] http://archive.ubuntu.com/ubuntu jammy-backports main restricted universe multiverse
          deb [arch=amd64] http://security.ubuntu.com/ubuntu jammy-security main restricted universe multiverse

          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy main restricted universe multiverse
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy-updates main restricted universe multiverse
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy-backports main restricted universe multiverse
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy-security main restricted universe multiverse
          EOF
          sudo mv /etc/apt/sources.list /etc/apt/sources.list.default
          sudo mv /tmp/sources.list /etc/apt/sources.list

          sudo dpkg --add-architecture arm64
          sudo apt-get update
          # libssl3 is Multi-Arch: same; align the preinstalled :amd64 copy
          # with the version libssl-dev:arm64 pins so the cross install isn't
          # blocked by a held-back amd64 copy.
          sudo apt-get install -y --only-upgrade libssl3
          sudo apt-get install -y \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            libssl-dev:arm64
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_ALLOW_CROSS=1" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=/usr/lib/aarch64-linux-gnu/pkgconfig:/usr/share/pkgconfig" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_LIBDIR=/usr/lib/aarch64-linux-gnu/pkgconfig:/usr/share/pkgconfig" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_SYSROOT_DIR=/usr/aarch64-linux-gnu" >> "$GITHUB_ENV"
          echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
          echo "CXX_aarch64_unknown_linux_gnu=aarch64-linux-gnu-g++" >> "$GITHUB_ENV"
          echo "AR_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc-ar" >> "$GITHUB_ENV"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"

      - name: Build frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Build server + codeg-mcp companion
        working-directory: src-tauri
        # `codeg-mcp` is the stdio MCP companion the runtime injects per
        # session (see acp/delegation/companion.rs). Built with the same
        # `--no-default-features --target` flags as the server so it shares
        # the cross-compile env (Linux arm64) without dragging in tauri
        # runtime deps.
        run: |
          cargo build --release --bin codeg-server --no-default-features --target ${{ matrix.target }}
          cargo build --release --bin codeg-mcp --no-default-features --target ${{ matrix.target }}

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist/${{ matrix.artifact }}
          cp src-tauri/target/${{ matrix.target }}/release/codeg-server dist/${{ matrix.artifact }}/
          cp src-tauri/target/${{ matrix.target }}/release/codeg-mcp dist/${{ matrix.artifact }}/
          chmod +x dist/${{ matrix.artifact }}/codeg-server dist/${{ matrix.artifact }}/codeg-mcp
          cp -r out dist/${{ matrix.artifact }}/web
          cd dist && tar czf ${{ matrix.artifact }}.tar.gz ${{ matrix.artifact }}

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/${{ matrix.artifact }}
          Copy-Item src-tauri/target/${{ matrix.target }}/release/codeg-server.exe dist/${{ matrix.artifact }}/
          Copy-Item src-tauri/target/${{ matrix.target }}/release/codeg-mcp.exe dist/${{ matrix.artifact }}/
          Copy-Item -Recurse out dist/${{ matrix.artifact }}/web
          Compress-Archive -Path dist/${{ matrix.artifact }} -DestinationPath dist/${{ matrix.artifact }}.zip

      - name: Smoke test packaged artifact (Unix)
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          test -x "dist/${{ matrix.artifact }}/codeg-server"
          test -x "dist/${{ matrix.artifact }}/codeg-mcp"
          # `codeg-mcp --help` exits 0 without flags and prints the usage
          # line. Only run it for native targets; cross-compiled arm64
          # binaries on x64 runners can't execute.
          if [ "${{ matrix.target }}" = "x86_64-unknown-linux-gnu" ] || \
             [ "${{ matrix.target }}" = "x86_64-apple-darwin" ] || \
             [ "${{ matrix.target }}" = "aarch64-apple-darwin" ]; then
            "dist/${{ matrix.artifact }}/codeg-mcp" --help | grep -F 'codeg-mcp --parent-connection-id'
          else
            echo "skipping codeg-mcp --help on cross-target ${{ matrix.target }}"
          fi

      - name: Smoke test packaged artifact (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/${{ matrix.artifact }}/codeg-server.exe")) {
            throw "codeg-server.exe missing from packaged artifact"
          }
          if (-not (Test-Path "dist/${{ matrix.artifact }}/codeg-mcp.exe")) {
            throw "codeg-mcp.exe missing from packaged artifact"
          }
          $help = & "dist/${{ matrix.artifact }}/codeg-mcp.exe" --help
          if ($help -notlike "*codeg-mcp --parent-connection-id*") {
            throw "codeg-mcp --help output unexpected: $help"
          }

      - name: Upload artifact for Docker build (Linux only)
        if: startsWith(matrix.target, 'x86_64-unknown-linux') || startsWith(matrix.target, 'aarch64-unknown-linux')
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}
          retention-days: 1

      # Keep the existing server minisign key and signature format.
      # `tauri signer sign` remains a signing utility; the server's
      # `update::verify` module verifies this signature against the embedded
      # public key before installing — see src-tauri/src/update/verify.rs.
      # Missing key is a hard error: every release must ship signed artifacts
      # so in-app auto-update can verify them.
      - name: Sign and checksum bundle (Unix)
        if: runner.os != 'Windows'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            echo "FATAL: TAURI_SIGNING_PRIVATE_KEY is required to sign ${{ matrix.artifact }}"
            exit 1
          fi
          pnpm tauri signer sign "dist/${{ matrix.artifact }}.tar.gz"
          test -f "dist/${{ matrix.artifact }}.tar.gz.sig"
          ( cd dist && shasum -a 256 "${{ matrix.artifact }}.tar.gz" > "${{ matrix.artifact }}.tar.gz.sha256" )

      - name: Sign and checksum bundle (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) {
            throw "TAURI_SIGNING_PRIVATE_KEY is required to sign ${{ matrix.artifact }}"
          }
          pnpm tauri signer sign "dist/${{ matrix.artifact }}.zip"
          if (-not (Test-Path "dist/${{ matrix.artifact }}.zip.sig")) {
            throw "signature not produced for ${{ matrix.artifact }}.zip"
          }
          $hash = (Get-FileHash -Algorithm SHA256 "dist/${{ matrix.artifact }}.zip").Hash.ToLower()
          "$hash  ${{ matrix.artifact }}.zip" | Out-File -Encoding ascii "dist/${{ matrix.artifact }}.zip.sha256"

      - name: Upload to release (Unix)
        if: runner.os != 'Windows'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          files=( "dist/${{ matrix.artifact }}.tar.gz" "dist/${{ matrix.artifact }}.tar.gz.sha256" )
          if [ -f "dist/${{ matrix.artifact }}.tar.gz.sig" ]; then
            files+=( "dist/${{ matrix.artifact }}.tar.gz.sig" )
          fi
          gh release upload "${{ github.ref_name }}" "${files[@]}" --clobber

      - name: Upload to release (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $files = @("dist/${{ matrix.artifact }}.zip", "dist/${{ matrix.artifact }}.zip.sha256")
          if (Test-Path "dist/${{ matrix.artifact }}.zip.sig") {
            $files += "dist/${{ matrix.artifact }}.zip.sig"
          }
          gh release upload "${{ github.ref_name }}" $files --clobber

  build-docker:
    # SERVER_TARGETS 为空时 build-server 被跳过，本任务也随之自动跳过。
    needs:
      - create-draft-release
      - build-server
      - resolve-matrix
    if: needs.resolve-matrix.outputs.docker == 'true'
    name: Build Docker image
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Download Linux x64 artifact
        uses: actions/download-artifact@v4
        with:
          name: MaxCode-server-linux-x64
          path: artifacts/linux-x64

      - name: Download Linux arm64 artifact
        uses: actions/download-artifact@v4
        with:
          name: MaxCode-server-linux-arm64
          path: artifacts/linux-arm64

      - name: Prepare Docker build context
        run: |
          set -euo pipefail
          mkdir -p dist/amd64 dist/arm64
          cp artifacts/linux-x64/codeg-server dist/amd64/codeg-server
          cp artifacts/linux-x64/codeg-mcp dist/amd64/codeg-mcp
          cp artifacts/linux-arm64/codeg-server dist/arm64/codeg-server
          cp artifacts/linux-arm64/codeg-mcp dist/arm64/codeg-mcp
          cp -r artifacts/linux-x64/web dist/web
          chmod +x dist/amd64/codeg-server dist/amd64/codeg-mcp \
                   dist/arm64/codeg-server dist/arm64/codeg-mcp
          # Fail fast if any companion went missing — Docker would otherwise
          # produce an image where delegation silently degrades.
          for f in dist/amd64/codeg-mcp dist/arm64/codeg-mcp; do
            test -x "$f" || { echo "FATAL: $f missing or non-exec"; exit 1; }
          done

      - name: Set up QEMU (for multi-arch manifest)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image tags
        id: version
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          image_repository="${GITHUB_REPOSITORY,,}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          tags=$'ghcr.io/'"$image_repository"':'"$version"$'\n''ghcr.io/'"$image_repository"':latest'
          if [ -n "${DOCKERHUB_USERNAME}" ]; then
            echo "dockerhub=true" >> "$GITHUB_OUTPUT"
            tags+=$'\n'"${DOCKERHUB_USERNAME}/codeg:${version}"$'\n'"${DOCKERHUB_USERNAME}/codeg:latest"
          else
            echo "dockerhub=false" >> "$GITHUB_OUTPUT"
          fi
          {
            echo "tags<<EOF"
            printf '%s\n' "$tags"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        if: steps.version.outputs.dockerhub == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.ci
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.version.outputs.tags }}

  publish-release:
    needs:
      - create-draft-release
      - resolve-matrix
      - build-electron
      - build-server
      - build-docker
    # Every selected build must pass, including signature and packaged smoke checks.
    if: >-
      ${{ always() && !cancelled() &&
          needs.create-draft-release.result == 'success' &&
          (needs.build-electron.result == 'success' || needs.build-electron.result == 'skipped') &&
          (needs.build-server.result == 'success' || needs.build-server.result == 'skipped') &&
          (needs.build-docker.result == 'success' || needs.build-docker.result == 'skipped') &&
          (needs.build-electron.result == 'success' || needs.build-server.result == 'success') }}
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Require all selected installers and signed server assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release view "$GITHUB_REF_NAME" --json assets | node electron/scripts/release.cjs validate-assets

      - name: Publish draft release
        uses: actions/github-script@v7
        env:
          RELEASE_ID: ${{ needs.create-draft-release.outputs.release_id }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const releaseId = Number(process.env.RELEASE_ID);
            const prerelease =
              "${{ needs.create-draft-release.outputs.prerelease }}" === "true";

            await github.rest.repos.updateRelease({
              owner,
              repo,
              release_id: releaseId,
              draft: false,
              prerelease,
            });

            core.info(`Published release #${releaseId}`);
