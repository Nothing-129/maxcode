name: Legacy Tauri compatibility

# Kept for upstream integration and remaining Tauri-only features.
# This is not the supported desktop release pipeline.
on:
  workflow_dispatch:

env:
  RUST_BACKTRACE: short
  INSTA_UPDATE: "no"

jobs:
  rust:
    name: Legacy Tauri on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15, windows-2022]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          shared-key: legacy-tauri-${{ matrix.os }}
      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Prepare Tauri frontendDist placeholder
        # Only used for Rust compilation; the default frontend job builds the real export.
        shell: bash
        run: |
          mkdir -p out
          printf '<!doctype html><html><body></body></html>\n' > out/index.html
      - name: cargo test
        # Tauri test binaries may not load on Windows CI; retain compile coverage there.
        working-directory: src-tauri
        run: cargo test --features tauri-runtime,test-utils ${{ runner.os == 'Windows' && '--no-run' || '' }}
      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets --features tauri-runtime,test-utils -- -D warnings
